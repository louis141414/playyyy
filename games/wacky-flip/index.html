<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Wacky Flip</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #unity-container {
      width: 100%;
      height: 100%;
      position: relative;
    }
    #unity-canvas {
      width: 100%;
      height: 100%;
      background: #231F20;
      display: block;
    }
    #loading-cover {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      z-index: 10;
    }
    #loading-cover.hidden {
      display: none;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255,255,255,0.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    #progress-bar {
      width: 200px;
      height: 6px;
      background: #333;
      border-radius: 3px;
      overflow: hidden;
      margin-top: 12px;
    }
    #progress-fill {
      height: 100%;
      width: 0%;
      background: #4CAF50;
      transition: width 0.15s ease;
    }
    #progress-text {
      margin-top: 10px;
      font-size: 14px;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading-cover">
      <div class="spinner"></div>
      <div>Loading Wacky Flip...</div>
      <div id="progress-bar"><div id="progress-fill"></div></div>
      <div id="progress-text">0%</div>
    </div>
  </div>

  <script>
    // Stubs for functions the game expects from the original portal SDKs / Firebase.
    // These do nothing so the game can run fully offline with no external calls.
    window.firebaseLogEventParameter = function () {};
    window.firebaseLogEvent = function () {};
    window.firebaseSetUserProperties = function () {};
    window.firebaseConfig = window.firebaseConfig || {};
    window.gmStartGame = function (cb) { if (typeof cb === "function") cb(); };
    window.gmStartAds = function (cb) { if (typeof cb === "function") cb(); };
    window.gmEvent = function () {};
    window.gmdebug = function () {};
    window.gmdebugtime = function () {};
    window.GMSOFT_GAME_INFO = { allow_play: "yes", more_games_url: "" };
    window.GMSOFT_ADS_INFO = { enable: "no", sdk_type: "none" };
    window.GMSOFT_SDKTYPE = "none";

    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/wacky-flip-v26080604.loader.js";
    var config = {
      dataUrl: buildUrl + "/wacky-flip-v26080604.data.unityweb",
      frameworkUrl: buildUrl + "/wacky-flip-v26080604.framework.js.unityweb",
      codeUrl: buildUrl + "/wacky-flip-v26080604.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Local",
      productName: "Wacky Flip",
      productVersion: "1.0"
    };

    var container = document.querySelector("#unity-container");
    var canvas = document.querySelector("#unity-canvas");
    var loadingCover = document.querySelector("#loading-cover");
    var progressFill = document.querySelector("#progress-fill");
    var progressText = document.querySelector("#progress-text");

    // Mobile detection for better defaults
    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      container.className = "unity-mobile";
      config.devicePixelRatio = 1;
    }

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        var pct = Math.round(progress * 100);
        progressFill.style.width = pct + "%";
        progressText.textContent = pct + "%";
      }).then(function (unityInstance) {
        loadingCover.classList.add("hidden");
        // Optional: expose instance for debugging
        window.unityInstance = unityInstance;
      }).catch(function (message) {
        alert("Failed to load game: " + message);
        console.error(message);
      });
    };
    script.onerror = function () {
      alert("Failed to load Unity loader. Make sure the Build folder is present.");
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
