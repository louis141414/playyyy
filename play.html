<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#070707">
    <link rel="icon" href="assets/images/favicon.ico" type="image/x-icon">
    <link rel="manifest" href="manifest.json">
    <title>Playyyy</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="assets/js/utm.js" defer></script>
    <script src="verify/verify.js"></script>
</head>

<body>
    <header>
        <h1 id="game-title">Loading...</h1>
        <a class="game-home-link" id="game-home-link" href="index.html">← Back to Games</a>
        <button class="theme-toggle" id="theme-toggle" type="button">Light mode</button>
        <button id="fullscreen-btn" onclick="toggleFullscreen()" style="background: none; border: none; color: #00ff9d; font-size: 1.2em; cursor: pointer; margin-left: 10px;">⛶</button>
    </header>

    <div id="game-container" class="glass">
        <iframe id="game-iframe" allowfullscreen></iframe>
        <div class="description" id="description"></div>
        <a href="https://statcounter.com/p13299407/?guest=1">->
Stats</a>
    </div>
    <div class="offline-indicator" id="offline-indicator" role="status" hidden>You are offline. The app shell is available; games may need an internet connection.</div>

    <script src="assets/js/script.js"></script>
    <script>
        function toggleFullscreen() {
          const iframe = document.getElementById('game-iframe');
          if (!document.fullscreenElement) {
            iframe.requestFullscreen().catch(err => {
              console.error(`Error: ${err.message}`);
            });
          } else {
            document.exitFullscreen();
          }
        }
    </script>
</body>
</html>
